<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Warzone FPS</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; user-select: none; background: #111; color: white; }
        #game-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        .screen { position: absolute; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; background: rgba(0,0,0,0.95); }
        .hidden { display: none !important; }
        .panel { background: #222; padding: 40px; border-radius: 10px; text-align: center; border: 1px solid #444; width: 350px; position: relative; }
        
        input, select { padding: 12px; margin: 5px; font-size: 16px; background: #333; color: white; border: 1px solid #555; text-align: center; width: 90%; }
        button { padding: 10px 20px; margin: 5px; font-size: 16px; cursor: pointer; background: #d35400; color: white; border: none; font-weight: bold; border-radius: 5px; }
        .btn-link { background: none; color: #3498db; text-decoration: underline; font-size: 14px; padding: 0; }
        .btn-sm { font-size: 12px; padding: 5px 10px; margin: 2px; }
        
        #friend-panel { background: rgba(0,0,0,0.8); padding: 10px; border: 1px solid #444; width: 280px; position: absolute; right: 20px; top: 20px; border-radius: 5px; max-height: 400px; overflow-y: auto; text-align: left; }
        .friend-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding: 5px 0; }
        
        #chat-ui { position: absolute; bottom: 80px; left: 20px; width: 350px; z-index: 200; pointer-events: auto; }
        #chat-messages { height: 150px; overflow-y: auto; background: rgba(0,0,0,0.5); padding: 5px; margin-bottom: 5px; font-size: 14px; color: #eee; border-radius: 5px; pointer-events: none; }
        #chat-input { width: 100%; background: rgba(0,0,0,0.7); border: 1px solid #555; color: white; padding: 8px; display: none; pointer-events: auto; }
        .chat-msg { margin-bottom: 2px; text-shadow: 1px 1px 0 #000; }
        .chat-blue { color: #3498db; }
        .chat-red { color: #e74c3c; }

        #ui-layer { position: absolute; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
        #crosshair { position: absolute; top:50%; left:50%; width: 24px; height: 24px; pointer-events:none; z-index:2000; display:none; }
        #crosshair::before { content:''; position:absolute; left:11px; width:2px; height:24px; background:#0f0; }
        #crosshair::after { content:''; position:absolute; top:11px; width:24px; height:2px; background:#0f0; }
        
        #minimap-container { position: absolute; top: 20px; left: 20px; width: 160px; height: 160px; border: 2px solid #666; background: rgba(0,0,0,0.8); border-radius: 10px; overflow: hidden; }
        #minimap { width: 100%; height: 100%; }
        #top-bar { position: absolute; top: 10px; width: 100%; text-align: center; font-size: 24px; font-weight: bold; text-shadow: 2px 2px 0 #000; }
        #room-display { position: absolute; top: 20px; right: 20px; font-size: 18px; color: #f1c40f; }
        #feed { position: absolute; top: 80px; right: 20px; text-align: right; }
        .feed-item { background: rgba(0,0,0,0.5); padding: 4px 8px; margin-bottom: 2px; color: white; font-weight: bold; }
        
        #stats { position: absolute; bottom: 20px; left: 20px; display: flex; gap: 20px; }
        .stat-box { background: rgba(0,0,0,0.6); padding: 15px; border-left: 5px solid orange; min-width: 80px; }
        .big-txt { font-size: 32px; font-weight: bold; }
        .label { font-size: 12px; color: #aaa; }
        
        #weapon-bar { position: absolute; bottom: 20px; right: 20px; display: flex; gap: 10px; }
        .w-slot { background: rgba(0,0,0,0.5); padding: 10px 20px; border: 2px solid #555; color: #888; font-weight: bold; }
        .w-active { border-color: #0f0; color: #fff; transform: translateY(-5px); background: rgba(0,255,0,0.1); }
        
        #scoreboard { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.95); padding: 20px; width: 600px; display: none; z-index: 1500; border: 1px solid #555; pointer-events: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #333; }
        th { color: #f39c12; }
        
        #pause-menu { z-index: 2000; background: rgba(0,0,0,0.8); }
        #death-screen { background: rgba(50,0,0,0.9); z-index: 2000; }
        
        /* END SCREEN */
        #end-screen { background: rgba(0,0,0,0.95); z-index: 3000; }
        #end-screen h1 { font-size: 60px; color: gold; text-shadow: 0 0 20px yellow; }
        #rank-table { width: 100%; margin-top: 20px; border: 1px solid #444; }
    </style>
</head>
<body>

    <div id="auth-screen" class="screen"><div class="panel"><h1>WARZONE</h1><button id="btn-play-guest">GUEST</button><button id="btn-show-login">LOGIN</button><button id="btn-show-register">REGISTER</button><p id="auth-error-msg" style="color:red"></p></div></div>
    <div id="login-screen" class="screen hidden"><div class="panel"><h2>LOGIN</h2><input id="login-user" placeholder="User"><input type="password" id="login-pass" placeholder="Pass"><button id="btn-login">LOGIN</button><button id="btn-back-auth">BACK</button><p id="login-error-msg" style="color:red"></p></div></div>
    <div id="register-screen" class="screen hidden"><div class="panel"><h2>REGISTER</h2><input id="reg-user" placeholder="User"><input type="password" id="reg-pass" placeholder="Pass"><button id="btn-register">REGISTER</button><button id="btn-back-auth-reg">BACK</button><p id="register-error-msg" style="color:red"></p></div></div>
    
    <div id="game-menu-screen" class="screen hidden">
        <div id="friend-panel" style="display:none;"><h4>FRIENDS</h4><div style="display:flex;"><input id="add-friend-in" placeholder="User"><button id="btn-add-friend">+</button></div><div id="friend-list"></div></div>
        <div class="panel"><h1>LOBBY</h1><p id="welcome-msg"></p><input id="guest-input" placeholder="Name" style="display:none"><select id="team-select"><option value="#3498db">Blue</option><option value="#e74c3c">Red</option></select><br><button id="btn-quick">QUICK</button><button id="btn-host">HOST</button><button id="btn-join">JOIN</button><div id="join-area" style="display:none"><input id="room-code-in" placeholder="CODE"><button id="btn-go">ENTER</button></div><br><button id="btn-cust">LOADOUT</button><button id="btn-show-stats">STATS</button><button id="btn-logout">LOGOUT</button></div>
    </div>
    
    <div id="stats-screen" class="screen hidden"><div class="panel"><h2>STATS</h2><p>Name: <span id="stats-username" style="color:#0f0"></span></p><p>Kills: <span id="stats-kills"></span></p><p>Deaths: <span id="stats-deaths"></span></p><p>KD: <span id="stats-kd"></span></p><button id="btn-close-stats">CLOSE</button></div></div>
    <div id="cust-screen" class="screen hidden"><div class="panel"><h2>LOADOUT</h2><select id="cust-gun"><option value="ak47">AK-47</option><option value="sniper">Sniper</option><option value="rpg">RPG</option></select><br><label>Skin:</label><select id="cust-skin"><option value="normal">Standard</option><option value="gold">Gold</option><option value="camo">Camo</option><option value="neon">Neon</option></select><br><button id="btn-save">SAVE</button></div></div>
    <div id="pause-menu" class="screen hidden"><div class="panel"><h2>PAUSED</h2><button id="btn-resume">RESUME</button><button id="btn-change-gun">LOADOUT</button><button id="btn-leave">LEAVE</button></div></div>
    
    <div id="death-screen" class="screen hidden"><h1>ELIMINATED</h1><select id="death-gun-select"><option value="ak47">AK</option><option value="sniper">Sniper</option><option value="rpg">RPG</option></select><br><button id="btn-respawn">RESPAWN</button><button id="btn-leave-death">LEAVE</button></div>
    <div id="end-screen" class="screen hidden"><h1>VICTORY!</h1><h2 id="winner-text"></h2><div class="panel" style="width:500px;"><h3>RANKINGS</h3><table id="rank-table"><thead><tr><th>Rank</th><th>Player</th><th>Kills</th><th>Deaths</th></tr></thead><tbody id="rank-body"></tbody></table><br><button id="btn-return-home">LOBBY</button></div></div>

    <div id="ui-layer" class="hidden">
        <div id="minimap-container"><canvas id="minimap" width="160" height="160"></canvas></div>
        <div id="top-bar"><span style="color:#3498db" id="s-blue">0</span> - <span style="color:#e74c3c" id="s-red">0</span></div>
        <div id="room-display"></div><div id="feed"></div>
        <div id="stats"><div class="stat-box"><div class="big-txt" id="hp">100</div>HEALTH</div><div class="stat-box"><div class="big-txt" id="ammo">120</div>AMMO</div><div class="stat-box"><div class="big-txt" id="nades">3</div>NADES</div></div>
        <div id="weapon-bar"><div class="w-slot w-active" id="s1">1. PRI</div><div class="w-slot" id="s2">2. SEC</div><div class="w-slot" id="s3">3. GRE</div></div>
        <div id="scoreboard"><h3>SCOREBOARD</h3><table><thead><tr><th>Name</th><th>Team</th><th>Score</th><th>Kills</th><th>Action</th></tr></thead><tbody id="sb-body"></tbody></table></div>
        <div id="chat-ui"><div id="chat-messages"></div><input id="chat-input" placeholder="Enter..."></div>
    </div>

    <div id="crosshair"></div>
    <div id="game-container"></div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>
</body>
</html>
